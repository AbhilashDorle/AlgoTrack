version: "3.9"
services:
  db:
    image: postgres:16
    container_name: mypostgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/abhilash/Postgres/

volumes:
  postgres_data:
